name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Test
        run: dotnet test -c Release
      - name: Publish win-x64 (framework-dependent)
        run: >
          dotnet publish src/CodeAgent -c Release -r win-x64
          --self-contained false -o dist/win-x64
      - name: Publish linux-x64 (framework-dependent)
        run: >
          dotnet publish src/CodeAgent -c Release -r linux-x64
          --self-contained false -o dist/linux-x64
      - name: Publish win-x64 (self-contained single file)
        run: >
          dotnet publish src/CodeAgent -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o dist/win-x64-sc
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/win-x64 -DestinationPath dist/codeagent-win-x64.zip
          Compress-Archive -Path dist/linux-x64 -DestinationPath dist/codeagent-linux-x64.zip
          Compress-Archive -Path dist/win-x64-sc/codeagent.exe -DestinationPath dist/codeagent-win-x64-selfcontained.zip
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codeagent-win-x64.zip
            dist/codeagent-linux-x64.zip
            dist/codeagent-win-x64-selfcontained.zip
